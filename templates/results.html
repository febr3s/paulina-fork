{% extends "layout.html" %}

{% block title %}Results{% endblock %}

{% block content %}

<div class="container-fluid w-75 p-3">
    <h2 class="p-3">Search results</h2>
    <div class="list-group p-3">
        {% for author in list_of_authors %}
        <a href="{{ url_for('author_page', author_data=author[2]) }}" class="list-group-item list-group-item-action">
        <div class="d-flex w-100 justify-content-between">
        <h5 class="mb-1">{{ author[0] }}</h5>
        </div>
        <p class="mb-1">{{ author[1] }}</p>
        </a>
        {% endfor %}

    </div>

</div>
{% endblock %}
